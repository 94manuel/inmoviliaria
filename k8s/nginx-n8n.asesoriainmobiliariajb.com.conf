server {
    listen 80;
    listen [::]:80;

    server_name n8n.asesoriainmobiliariajb.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://n8n.asesoriainmobiliariajb.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name n8n.asesoriainmobiliariajb.com;

    access_log /var/log/nginx/n8n.asesoriainmobiliariajb.com.access.log;
    error_log /var/log/nginx/n8n.asesoriainmobiliariajb.com.error.log;

    ssl_certificate /etc/letsencrypt/live/n8n.asesoriainmobiliariajb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.asesoriainmobiliariajb.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:30080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
