apiVersion: batch/v1
kind: Job
metadata:
  name: asesoria-cargar-usuarios-historicos
  namespace: asesoria-inmobiliaria
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: asesoria-cargar-usuarios-historicos
    spec:
      restartPolicy: Never
      containers:
        - name: cargar-datos
          image: asesoria-inmobiliaria-api:local
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
            - npm run import:arrendamientos -w @inmobiliaria/api
          envFrom:
            - configMapRef:
                name: asesoria-config
            - secretRef:
                name: asesoria-secrets
