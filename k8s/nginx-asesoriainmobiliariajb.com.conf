server {
    listen 80;
    listen [::]:80;
    server_name asesoriainmobiliariajb.com www.asesoriainmobiliariajb.com;
    return 301 https://asesoriainmobiliariajb.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.asesoriainmobiliariajb.com;

    ssl_certificate /etc/letsencrypt/live/asesoriainmobiliariajb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asesoriainmobiliariajb.com/privkey.pem;

    return 301 https://asesoriainmobiliariajb.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asesoriainmobiliariajb.com;

    ssl_certificate /etc/letsencrypt/live/asesoriainmobiliariajb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asesoriainmobiliariajb.com/privkey.pem;

    access_log /var/log/nginx/asesoriainmobiliariajb.com.access.log;
    error_log /var/log/nginx/asesoriainmobiliariajb.com.error.log;

    # Debe superar el límite interno de 70 MB y el límite de Server Actions (75 MB).
    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:30080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }
}
