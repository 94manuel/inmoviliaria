apiVersion: v1
kind: PersistentVolume
metadata:
  name: asesoria-n8n-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: asesoria-local
  hostPath:
    path: /var/lib/asesoria-inmobiliaria/n8n
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - srv1704143
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: asesoria-inmobiliaria
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: asesoria-local
  volumeName: asesoria-n8n-pv
  resources:
    requests:
      storage: 10Gi
